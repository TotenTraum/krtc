<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>krtc-sfu</title>
<style>
  :root { --bg: #f6f7f9; --fg: #1d2129; --muted: #6b7280; --card: #fff; --line: #e3e6eb; --accent: #2f6fde; --speak: #1fa463; --tile: #dfe3ea; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171c; --fg: #e8eaee; --muted: #9aa1ad; --card: #1e2128; --line: #2c3039; --accent: #6b9bff; --speak: #34c27a; --tile: #262a33; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  label { display: block; margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  input[type=text], select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; margin-top: 4px; }
  button { padding: 8px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  #status { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .tile { position: relative; aspect-ratio: 16 / 9; background: var(--tile); border-radius: 8px; overflow: hidden; outline: 3px solid transparent; transition: outline-color .15s; }
  .tile.speaking { outline-color: var(--speak); }
  .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .layers { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
  .tile .layers button { padding: 2px 8px; font-size: 12px; background: rgba(0,0,0,.45); }
  .tile .layers button.on { background: var(--accent); }
  #chat { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
  #log { max-height: 200px; overflow-y: auto; font-size: 14px; margin-bottom: 8px; }
  #log .who { color: var(--muted); }
  #say { display: flex; gap: 8px; }
  #say input { flex: 1; margin: 0; }
  .tile .label { position: absolute; left: 8px; bottom: 8px; right: 8px; display: flex; justify-content: space-between; gap: 8px;
    font-size: 12px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.7); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>krtc-sfu — комната</h1>
  <form id="join" class="card">
    <label>Комната <input type="text" id="room" value="test" required></label>
    <label>Имя <input type="text" id="name" required></label>
    <label>Видео
      <select id="video">
        <option value="test" selected>Тестовая анимация</option>
        <option value="camera">Камера</option>
        <option value="none">Без видео</option>
      </select>
    </label>
    <label><input type="checkbox" id="fake" checked> Тестовый звук вместо микрофона</label>
    <label><input type="checkbox" id="play" checked> Воспроизводить звук собеседников</label>
    <button type="submit">Войти</button>
  </form>
  <section id="call" class="card" hidden>
    <p id="status">Подключение…</p>
    <p><button type="button" id="share">Показать экран</button>
      <select id="fps" title="Кадров в секунду при показе экрана"><option value="15" selected>15 к/с</option><option value="30">30 к/с</option><option value="60">60 к/с</option></select>
      <button type="button" id="mic">Выключить микрофон</button></p>
    <div id="grid"></div>
    <div id="chat">
      <div id="log"></div>
      <form id="say"><input type="text" id="text" placeholder="Сообщение всем в комнате" autocomplete="off" disabled><button type="submit">Отправить</button></form>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
$('name').value = 'user-' + Math.floor(Math.random() * 1000);
// ?mute=1 — don't play remote audio (several tabs on one machine); ?video=test|camera|none
const params = new URLSearchParams(location.search);
if (params.get('mute') === '1') $('play').checked = false;
if (params.get('video')) $('video').value = params.get('video');

const state = { ws: null, pc: null, myId: null, audio: null, video: null, screen: null, screenAudio: null, peers: new Map(), midToPeer: new Map(), screenMids: new Set(), messages: [] };
window.krtc = state; // for automated checks

function fakeAudio() {
  // A quiet beeping tone (half a second on, half off) so the SFU's speaking detection toggles.
  const ctx = new AudioContext();
  const osc = ctx.createOscillator();
  osc.frequency.value = 330 + Math.floor(Math.random() * 400);
  const gain = ctx.createGain();
  gain.gain.value = 0;
  const dest = ctx.createMediaStreamDestination();
  osc.connect(gain).connect(dest);
  osc.start();
  setInterval(() => { gain.gain.value = gain.gain.value > 0 ? 0 : 0.15; }, 500);
  return dest.stream.getAudioTracks()[0];
}

function fakeVideo(label) {
  const canvas = Object.assign(document.createElement('canvas'), { width: 1280, height: 720 });
  const g = canvas.getContext('2d');
  const hue = Math.floor(Math.random() * 360);
  let t = 0;
  // Ticks come from a worker: timers of background tabs are throttled to 1 Hz, worker timers are not,
  // so several test tabs on one screen all keep sending 15 fps.
  const ticker = new Worker(URL.createObjectURL(new Blob(['setInterval(() => postMessage(0), 1000 / 15)'], { type: 'text/javascript' })));
  ticker.onmessage = () => {
    t++;
    g.fillStyle = `hsl(${hue} 45% 30%)`;
    g.fillRect(0, 0, 1280, 720);
    g.fillStyle = `hsl(${(hue + 180) % 360} 70% 60%)`;
    g.beginPath();
    g.arc(640 + 440 * Math.cos(t / 15), 360 + 220 * Math.sin(t / 10), 80, 0, 2 * Math.PI);
    g.fill();
    g.fillStyle = '#fff';
    g.font = '56px system-ui';
    g.fillText(`${label}  ${new Date().toLocaleTimeString()}`, 48, 96);
  };
  return canvas.captureStream(15).getVideoTracks()[0];
}

// Room messages over the SFU's data channels: binary envelope (krtc-signaling DataEnvelope).
// version 1 | id count | (len, id)* | len, topic | payload. To the SFU: recipients; from the SFU: the sender.
const utf8 = new TextEncoder();
const fromUtf8 = new TextDecoder();
function wrap(ids, topic, payload) {
  const idBytes = ids.map((i) => utf8.encode(i));
  const t = utf8.encode(topic);
  const out = new Uint8Array(2 + idBytes.reduce((n, b) => n + 1 + b.length, 0) + 1 + t.length + payload.length);
  let at = 0;
  out[at++] = 1;
  out[at++] = ids.length;
  for (const b of idBytes) { out[at++] = b.length; out.set(b, at); at += b.length; }
  out[at++] = t.length; out.set(t, at); at += t.length;
  out.set(payload, at);
  return out;
}
function unwrap(buffer) {
  const d = new Uint8Array(buffer);
  if (d[0] !== 1) return null;
  let at = 1;
  const ids = [];
  for (let n = d[at++]; n > 0; n--) { const len = d[at++]; ids.push(fromUtf8.decode(d.subarray(at, at + len))); at += len; }
  const len = d[at++];
  const topic = fromUtf8.decode(d.subarray(at, at + len));
  return { ids, topic, payload: d.subarray(at + len) };
}
function openChannels(pc) {
  state.reliable = pc.createDataChannel('krtc');
  state.lossy = pc.createDataChannel('krtc-lossy', { ordered: false, maxRetransmits: 0 });
  for (const ch of [state.reliable, state.lossy]) {
    ch.binaryType = 'arraybuffer';
    ch.onmessage = (e) => {
      const m = unwrap(e.data);
      if (!m) return;
      const from = m.ids[0] ?? null;
      state.messages.push({ from, topic: m.topic, text: fromUtf8.decode(m.payload), reliable: ch === state.reliable });
      if (m.topic === 'chat') say(from ? (state.peers.get(from)?.name ?? from) : 'сервер', fromUtf8.decode(m.payload));
    };
  }
  state.reliable.onopen = () => { $('text').disabled = false; };
}
function sendData(topic, text, { to = [], reliable = true } = {}) {
  const ch = reliable ? state.reliable : state.lossy;
  if (ch?.readyState !== 'open') return false;
  ch.send(wrap(to, topic, utf8.encode(text)));
  return true;
}
state.sendData = sendData;
function say(who, text) {
  const line = document.createElement('div');
  line.innerHTML = '<span class="who"></span> ';
  line.querySelector('.who').textContent = who + ':';
  line.append(text);
  $('log').append(line);
  $('log').scrollTop = $('log').scrollHeight;
}
$('say').onsubmit = (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (text && sendData('chat', text)) { say('вы', text); $('text').value = ''; }
};

// Screen share: the `s` uplink (and `sa` for its sound) sends while there is a track; starting and stopping ask the
// SFU for a new offer.
async function shareScreen(track, audio = null) {
  if (state.screen) state.screen.onended = null;
  state.screen = track;
  state.screenAudio = track ? audio : null;
  if (track) {
    track.contentHint = 'detail'; // keep resolution and sharpness, drop frame rate under pressure
    track.onended = () => shareScreen(null); // the browser's "stop sharing"
    const me = tile(state.myId + '-screen', 'ваш экран', false);
    me.querySelector('video').srcObject = new MediaStream([track]);
  } else {
    $('tile-' + state.myId + '-screen')?.remove();
    for (const mid of ['s', 'sa']) {
      const t = state.pc.getTransceivers().find((x) => x.mid === mid);
      if (t) await t.sender.replaceTrack(null); // stop sending right away
    }
  }
  $('share').textContent = track ? 'Остановить показ' : 'Показать экран';
  state.ws.send(JSON.stringify({ type: 'renegotiate' }));
}
state.shareScreen = shareScreen;
$('share').onclick = async () => {
  if (state.screen) { state.screen.stop(); state.screenAudio?.stop(); return shareScreen(null); }
  // audio: the tab's or system sound where the browser offers it (Chrome: a checkbox in the picker).
  const fps = Number($('fps').value);
  const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: fps, max: fps } }, audio: true });
  await shareScreen(stream.getVideoTracks()[0], stream.getAudioTracks()[0] ?? null);
};

function tile(id, name, layers = true) {
  let el = $('tile-' + id);
  if (!el) {
    el = document.createElement('div');
    el.className = 'tile';
    el.id = 'tile-' + id;
    el.innerHTML = '<video autoplay playsinline muted></video><div class="label"><span class="who"></span><span class="meta"></span></div>';
    if (id !== state.myId && layers) {
      // Simulcast: ask the SFU for a lower or higher layer of this participant's video.
      const layers = document.createElement('div');
      layers.className = 'layers';
      for (const [rid, title] of [['q', 'низкое'], ['h', 'среднее'], ['f', 'высокое']]) {
        const b = Object.assign(document.createElement('button'), { textContent: rid, title: 'Качество: ' + title });
        b.classList.toggle('on', rid === 'f');
        b.onclick = () => setLayer(id, rid);
        layers.append(b);
      }
      el.append(layers);
    }
    $('grid').append(el);
  }
  el.querySelector('.who').textContent = name;
  return el;
}

// Mute state (media-state / peer-state): the others see that a microphone or camera is off.
function showState(id) {
  const p = state.peers.get(id);
  const el = document.querySelector('#tile-' + id + ' .who');
  if (!p || !el) return;
  el.textContent = p.name + (p.audioMuted ? ' · микрофон выключен' : '') + (p.videoMuted ? ' · камера выключена' : '');
}
$('mic').onclick = () => {
  if (!state.audio) return;
  state.audio.enabled = !state.audio.enabled;
  $('mic').textContent = state.audio.enabled ? 'Выключить микрофон' : 'Включить микрофон';
  state.ws.send(JSON.stringify({ type: 'media-state', audioMuted: !state.audio.enabled, videoMuted: !state.video }));
};

function setLayer(peer, rid) {
  state.ws.send(JSON.stringify({ type: 'layer', peer, layer: rid }));
  document.querySelectorAll(`#tile-${peer} .layers button`).forEach((b) => b.classList.toggle('on', b.textContent === rid));
}
state.setLayer = setLayer;

function setSpeaking(id, speaking) {
  const p = state.peers.get(id);
  if (p) p.speaking = speaking;
  $('tile-' + id)?.classList.toggle('speaking', speaking);
}

async function onOffer(msg) {
  const pc = state.pc;
  state.midToPeer = new Map(Object.entries(msg.mids)); // before SRD: ontrack fires during it
  state.screenMids = new Set(msg.screens ?? []);
  await pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp });
  for (const [mid, track] of [['0', state.audio], ['1', state.video]]) {
    const t = pc.getTransceivers().find((x) => x.mid === mid);
    if (t && track && t.sender.track !== track) {
      t.direction = 'sendonly';
      await t.sender.replaceTrack(track);
    }
  }
  for (const [mid, track] of [['s', state.screen], ['sa', state.screenAudio]]) {
    const s = pc.getTransceivers().find((x) => x.mid === mid);
    if (s && track) {
      s.direction = 'sendonly';
      if (s.sender.track !== track) await s.sender.replaceTrack(track);
    } else if (s && s.direction !== 'inactive') {
      await s.sender.replaceTrack(null);
      s.direction = 'inactive';
    }
  }
  // Screen shares that ended.
  const sharing = new Set([...state.screenMids].map((m) => state.midToPeer.get(m)));
  document.querySelectorAll('.tile.screen').forEach((el) => { if (!sharing.has(el.dataset.peer)) el.remove(); });
  await pc.setLocalDescription(await pc.createAnswer());
  state.ws.send(JSON.stringify({ type: 'answer', version: msg.version, sdp: pc.localDescription.sdp }));
}

async function summary() {
  const out = { sent: { audioBytes: 0, videoFrames: 0, width: 0, layers: {} }, peers: {} };
  const stats = await state.pc.getStats();
  stats.forEach((s) => {
    if (s.type === 'outbound-rtp' && s.kind === 'audio') out.sent.audioBytes += s.bytesSent;
    if (s.type === 'outbound-rtp' && s.mid === 'sa') {
      out.sent.screenAudioBytes = s.bytesSent;
      return;
    }
    if (s.type === 'outbound-rtp' && s.kind === 'video' && s.mid === 's') {
      out.sent.screen = { frames: s.framesEncoded ?? 0, width: s.frameWidth ?? 0, height: s.frameHeight ?? 0 };
      return;
    }
    if (s.type === 'outbound-rtp' && s.kind === 'video') {
      out.sent.videoFrames += s.framesEncoded ?? 0;
      out.sent.width = Math.max(out.sent.width, s.frameWidth ?? 0);
      if (s.rid) out.sent.layers[s.rid] = { width: s.frameWidth ?? 0, fps: s.framesPerSecond ?? 0, active: s.active };
    }
    if (s.type !== 'inbound-rtp') return;
    const peer = state.midToPeer.get(s.mid);
    if (!peer) return;
    if (state.screenMids.has(s.mid) && s.kind === 'audio') {
      Object.assign((out.screens ||= {})[peer] ||= {}, { audioPackets: s.packetsReceived, audioLevel: s.audioLevel ?? 0, audioEnergy: s.totalAudioEnergy ?? 0 });
      return;
    }
    if (state.screenMids.has(s.mid)) {
      Object.assign((out.screens ||= {})[peer] ||= {}, { framesDecoded: s.framesDecoded ?? 0, width: s.frameWidth ?? 0, height: s.frameHeight ?? 0, codec: stats.get(s.codecId)?.mimeType });
      return;
    }
    const p = (out.peers[peer] ||= {});
    if (s.kind === 'audio') Object.assign(p, { audioPackets: s.packetsReceived, audioLost: s.packetsLost, level: s.audioLevel ?? 0 });
    if (s.kind === 'video') Object.assign(p, {
      videoPackets: s.packetsReceived, videoLost: s.packetsLost, framesDecoded: s.framesDecoded ?? 0,
      width: s.frameWidth ?? 0, height: s.frameHeight ?? 0, nacks: s.nackCount ?? 0, plis: s.pliCount ?? 0,
      keyFrames: s.keyFramesDecoded ?? 0, codec: stats.get(s.codecId)?.mimeType,
    });
  });
  return out;
}
state.summary = summary;

$('join').onsubmit = async (e) => {
  e.preventDefault();
  $('join').hidden = true;
  $('call').hidden = false;
  const name = $('name').value;
  state.audio = $('fake').checked ? fakeAudio() : (await navigator.mediaDevices.getUserMedia({ audio: true })).getAudioTracks()[0];
  const mode = $('video').value;
  if (mode === 'test') state.video = fakeVideo(name);
  if (mode === 'camera') state.video = (await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } })).getVideoTracks()[0];

  const pc = (state.pc = new RTCPeerConnection());
  openChannels(pc); // they open once the SFU's offer brings the SCTP m-line and DTLS is up
  pc.ontrack = (ev) => {
    const peer = state.midToPeer.get(ev.transceiver.mid);
    if (state.screenMids.has(ev.transceiver.mid) && ev.track.kind === 'audio') {
      const audio = new Audio(); // the screen's sound
      audio.autoplay = true;
      audio.muted = !$('play').checked;
      audio.srcObject = new MediaStream([ev.track]);
    } else if (state.screenMids.has(ev.transceiver.mid)) {
      const el = tile(peer + '-screen', (state.peers.get(peer)?.name ?? peer) + ' — экран', false);
      el.classList.add('screen');
      el.dataset.peer = peer;
      el.querySelector('video').srcObject = new MediaStream([ev.track]);
      el.querySelector('video').style.objectFit = 'contain';
    } else if (ev.track.kind === 'video') {
      const v = tile(peer, state.peers.get(peer)?.name ?? peer).querySelector('video');
      v.srcObject = new MediaStream([ev.track]);
    } else {
      const audio = new Audio();
      audio.autoplay = true;
      audio.muted = !$('play').checked;
      audio.srcObject = new MediaStream([ev.track]);
    }
  };
  pc.onconnectionstatechange = () => { $('status').textContent = 'Соединение: ' + pc.connectionState; };

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const q = new URLSearchParams({ room: $('room').value, name });
  const ws = (state.ws = new WebSocket(`${proto}://${location.host}/ws?${q}`));
  ws.onclose = () => { $('status').textContent = 'Отключено'; };
  ws.onmessage = async (m) => {
    const msg = JSON.parse(m.data);
    switch (msg.type) {
      case 'welcome': {
        state.myId = msg.id;
        const me = tile(msg.id, name + ' (вы)');
        if (state.video) me.querySelector('video').srcObject = new MediaStream([state.video]);
        msg.peers.forEach((p) => { state.peers.set(p.id, p); tile(p.id, p.name); showState(p.id); });
        break;
      }
      case 'peer-joined': state.peers.set(msg.id, msg); tile(msg.id, msg.name); break;
      case 'peer-left': state.peers.delete(msg.id); $('tile-' + msg.id)?.remove(); $('tile-' + msg.id + '-screen')?.remove(); break;
      case 'speaking': setSpeaking(msg.id, msg.speaking); break;
      case 'peer-state': {
        const p = state.peers.get(msg.id);
        if (p) { p.audioMuted = msg.audioMuted; p.videoMuted = msg.videoMuted; showState(msg.id); }
        break;
      }
      case 'offer': await onOffer(msg); break;
    }
  };

  setInterval(async () => {
    if (!state.pc) return;
    const s = await summary();
    for (const [id, v] of Object.entries(s.peers)) {
      const meta = document.querySelector('#tile-' + id + ' .meta');
      if (meta) meta.textContent = v.width ? `${v.width}×${v.height} · ${v.codec?.split('/')[1] ?? ''} · потеряно ${v.videoLost}` : `аудио · потеряно ${v.audioLost ?? 0}`;
    }
    const mine = document.querySelector('#tile-' + state.myId + ' .meta');
    const layers = Object.entries(s.sent.layers).map(([rid, l]) => `${rid}:${l.width}`).join(' ');
    if (mine) mine.textContent = layers ? `simulcast ${layers}` : s.sent.width ? `${s.sent.width}p` : '';
  }, 1000);
};
</script>
</body>
</html>
