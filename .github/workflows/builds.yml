# Test builds of every platform: tests, then binaries uploaded as artifacts (Actions → run → Artifacts).
#
#   krtc-macos-arm64     SFU server and native demo client (Kotlin/Native)
#   krtc-ios             demo client for the simulator (run with `xcrun simctl spawn booted …`) and the device (unsigned)
#   krtc-jvm-demo-macos  demo client on the desktop JVM, macOS arm64 (needs Java 21+)
#   krtc-meet-macos      the krtc-meet app (ADR-0018) as a .dmg, unsigned (right-click → Open the first time)
#   krtc-linux-x64       SFU server and demo client (only glibc needed; OpenSSL is linked in)
#   krtc-linux-arm64     SFU server and demo client
#   krtc-sfu-jvm         SFU server on the JVM, any OS with Java 21+
#   krtc-android         demo APK (arm64), see krtc-native-android-demo
#   krtc-windows-x64     demo client: krtc-native-demo.exe with krtc.dll (keep them together), and the JVM demo
#                        for Windows (Java 21+); for the SFU on Windows use krtc-sfu-jvm
#
# Windows is cross-compiled on Linux (clang-cl + xwin in Docker): building that image accepts the Microsoft Visual
# Studio license for the MSVC CRT and Windows SDK files it downloads (see krtc-native/docker/windows/Dockerfile).
#
# How to run each one: krtc-native/README.md, section "Сборки CI".
name: builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WEBRTC_RELEASE: webrtc-a545de4
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  apple:
    name: macOS, iOS, JVM (macOS)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache libwebrtc
        uses: actions/cache@v4
        with:
          path: |
            krtc-native/.deps/mac-arm64
            krtc-native/.deps/ios-simulator-arm64
            krtc-native/.deps/ios-device-arm64
          key: webrtc-apple-${{ env.WEBRTC_RELEASE }}
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-macos-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: OpenSSL 3 (SFU on Kotlin/Native)
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
      - name: libwebrtc
        run: krtc-native/fetch-deps.sh mac-arm64 ios-simulator-arm64 ios-device-arm64
      - name: Tests
        run: ./gradlew :krtc-sfu:macosArm64Test
      - name: Build
        run: >
          ./gradlew
          :krtc-sfu-server:linkDebugExecutableMacosArm64
          :krtc-native:linkDemoDebugExecutableMacosArm64
          :krtc-native:linkDemoDebugExecutableIosSimulatorArm64
          :krtc-native:linkDemoDebugExecutableIosArm64
          :krtc-native:jvmDemoDistZip
          :krtc-meet:packageDmg
          -Pkrtc.jvm.windows=false
      - name: Collect
        run: |
          mkdir -p out/macos out/ios out/jvm out/meet
          cp krtc-meet/build/compose/binaries/main/dmg/*.dmg out/meet/
          cp krtc-sfu-server/build/bin/macosArm64/debugExecutable/krtc-sfu.kexe out/macos/
          cp krtc-native/build/bin/macosArm64/demoDebugExecutable/krtc-native-demo.kexe out/macos/
          cp krtc-native/build/bin/iosSimulatorArm64/demoDebugExecutable/krtc-native-demo.kexe out/ios/krtc-native-demo-simulator.kexe
          cp krtc-native/build/bin/iosArm64/demoDebugExecutable/krtc-native-demo.kexe out/ios/krtc-native-demo-device.kexe
          cp krtc-native/build/dist/krtc-native-jvm-demo.zip out/jvm/
      # Artifacts are zipped by GitHub and lose the executable bit: chmod +x after unzipping.
      - uses: actions/upload-artifact@v4
        with:
          name: krtc-macos-arm64
          path: out/macos
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: krtc-ios
          path: out/ios
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: krtc-jvm-demo-macos
          path: out/jvm
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: krtc-meet-macos
          path: out/meet
          retention-days: 14

  linux-android:
    name: Linux, Android, JVM SFU
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The arm64 shim is compiled in an arm64 container (docker-build-shim.sh), emulated here.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Cache libwebrtc
        uses: actions/cache@v4
        with:
          path: |
            krtc-native/.deps/linux-x64
            krtc-native/.deps/linux-arm64
            krtc-native/.deps/android-arm64
          key: webrtc-linux-android-${{ env.WEBRTC_RELEASE }}
      - name: Cache static OpenSSL
        uses: actions/cache@v4
        with:
          path: |
            krtc-sfu/.deps/openssl-linux-x64
            krtc-sfu/.deps/openssl-linux-arm64
          key: openssl-${{ hashFiles('krtc-sfu/build-openssl.sh') }}
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-linux-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: libwebrtc
        run: krtc-native/fetch-deps.sh linux-x64 linux-arm64 android-arm64
      # The ABI check runs here: it compiles the Linux targets anyway (static OpenSSL). Apple targets cannot be built
      # on Linux (cinterop needs the macOS SDK); with klib cross-compilation off they count as unsupported, and
      # keepLocallyUnsupportedTargets (root build.gradle.kts) takes their dumps from api/ as they are.
      - name: Tests and ABI
        run: >
          ./gradlew :krtc-protocol:jvmTest :krtc-signaling:jvmTest :krtc-sfu:jvmTest :krtc-sfu:linuxX64Test :krtc-client:jvmTest
          checkKotlinAbi -Pkotlin.native.enableKlibsCrossCompilation=false
      - name: Build
        run: >
          ./gradlew
          :krtc-sfu-server:linkDebugExecutableLinuxX64
          :krtc-sfu-server:linkDebugExecutableLinuxArm64
          :krtc-sfu-server:jvmDistZip
          :krtc-native:linkDemoDebugExecutableLinuxX64
          :krtc-native:linkDemoDebugExecutableLinuxArm64
          :krtc-native-android-demo:assembleDebug
      - name: Collect
        run: |
          mkdir -p out/linux-x64 out/linux-arm64 out/jvm out/android
          cp krtc-sfu-server/build/bin/linuxX64/debugExecutable/krtc-sfu.kexe out/linux-x64/
          cp krtc-sfu-server/build/bin/linuxArm64/debugExecutable/krtc-sfu.kexe out/linux-arm64/
          cp krtc-native/build/bin/linuxX64/demoDebugExecutable/krtc-native-demo.kexe out/linux-x64/
          cp krtc-native/build/bin/linuxArm64/demoDebugExecutable/krtc-native-demo.kexe out/linux-arm64/
          cp krtc-sfu-server/build/dist/krtc-sfu-jvm.zip out/jvm/
          cp krtc-native-android-demo/build/outputs/apk/debug/*.apk out/android/krtc-native-demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: krtc-linux-x64
          path: out/linux-x64
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: krtc-linux-arm64
          path: out/linux-arm64
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: krtc-sfu-jvm
          path: out/jvm
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: krtc-android
          path: out/android
          retention-days: 14

  windows:
    name: Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache libwebrtc
        uses: actions/cache@v4
        with:
          path: krtc-native/.deps/win-x64
          key: webrtc-windows-${{ env.WEBRTC_RELEASE }}
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-linux-mingw-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: libwebrtc
        run: krtc-native/fetch-deps.sh win-x64
      # krtc.dll (shim + JNI + libwebrtc) is built once by docker-build-shim.sh win and used by both builds below.
      - name: Build
        run: >
          ./gradlew
          :krtc-native:linkDemoDebugExecutableMingwX64
          :krtc-native:jvmDemoDistZip
          -Pkrtc.jvm.macos=false
      - name: Collect
        run: |
          mkdir -p out/windows
          cp krtc-native/build/bin/mingwX64/demoDebugExecutable/krtc-native-demo.exe out/windows/
          cp krtc-native/build/bin/mingwX64/demoDebugExecutable/krtc.dll out/windows/
          cp krtc-native/build/dist/krtc-native-jvm-demo.zip out/windows/krtc-native-jvm-demo-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: krtc-windows-x64
          path: out/windows
          retention-days: 14
