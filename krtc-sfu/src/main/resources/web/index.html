<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>krtc-sfu</title>
<style>
  :root { --bg: #f6f7f9; --fg: #1d2129; --muted: #6b7280; --card: #fff; --line: #e3e6eb; --accent: #2f6fde; --speak: #1fa463; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171c; --fg: #e8eaee; --muted: #9aa1ad; --card: #1e2128; --line: #2c3039; --accent: #6b9bff; --speak: #34c27a; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  label { display: block; margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; margin-top: 4px; }
  button { padding: 8px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
  .speaking .dot { background: var(--speak); box-shadow: 0 0 0 4px color-mix(in srgb, var(--speak) 25%, transparent); }
  .meta { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #status { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>krtc-sfu — голосовая комната</h1>
  <form id="join" class="card">
    <label>Комната <input type="text" id="room" value="test" required></label>
    <label>Имя <input type="text" id="name" required></label>
    <label><input type="checkbox" id="fake" checked> Тестовый сигнал вместо микрофона</label>
    <button type="submit">Войти</button>
  </form>
  <section id="call" class="card" hidden>
    <p id="status">Подключение…</p>
    <ul id="peers"></ul>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
$('name').value = 'user-' + Math.floor(Math.random() * 1000);

const state = { ws: null, pc: null, myId: null, track: null, peers: new Map(), midToPeer: new Map(), connected: false };
window.krtc = state; // for automated checks

function fakeTrack() {
  // A beeping tone: half a second on, half off, so the SFU's speaking detection toggles.
  const ctx = new AudioContext();
  const osc = ctx.createOscillator();
  osc.frequency.value = 330 + Math.floor(Math.random() * 400);
  const gain = ctx.createGain();
  gain.gain.value = 0;
  const dest = ctx.createMediaStreamDestination();
  osc.connect(gain).connect(dest);
  osc.start();
  setInterval(() => { gain.gain.value = gain.gain.value > 0 ? 0 : 0.6; }, 500);
  return dest.stream.getAudioTracks()[0];
}

function renderPeers() {
  const ul = $('peers');
  ul.replaceChildren();
  const me = { id: state.myId, name: $('name').value + ' (вы)' };
  for (const p of [me, ...state.peers.values()]) {
    const li = document.createElement('li');
    li.id = 'peer-' + p.id;
    if (p.speaking) li.classList.add('speaking');
    li.innerHTML = '<span class="dot"></span><span class="who"></span><span class="meta"></span>';
    li.querySelector('.who').textContent = p.name;
    ul.append(li);
  }
}

function setSpeaking(id, speaking) {
  const p = id === state.myId ? (state.me ||= {}) : state.peers.get(id);
  if (p) p.speaking = speaking;
  $('peer-' + id)?.classList.toggle('speaking', speaking);
}

async function onOffer(msg) {
  const pc = state.pc;
  await pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp });
  const up = pc.getTransceivers().find((t) => t.mid === '0');
  if (up && up.sender.track !== state.track) {
    up.direction = 'sendonly';
    await up.sender.replaceTrack(state.track);
  }
  state.midToPeer = new Map(Object.entries(msg.mids));
  await pc.setLocalDescription(await pc.createAnswer());
  state.ws.send(JSON.stringify({ type: 'answer', version: msg.version, sdp: pc.localDescription.sdp }));
}

async function summary() {
  const out = { sentBytes: 0, peers: {} };
  const stats = await state.pc.getStats();
  stats.forEach((s) => {
    if (s.type === 'outbound-rtp' && s.kind === 'audio') out.sentBytes += s.bytesSent;
    if (s.type === 'inbound-rtp' && s.kind === 'audio') {
      const peer = state.midToPeer.get(s.mid);
      if (peer) out.peers[peer] = { bytes: s.bytesReceived, packets: s.packetsReceived, lost: s.packetsLost, level: s.audioLevel ?? 0 };
    }
  });
  return out;
}
state.summary = summary;

$('join').onsubmit = async (e) => {
  e.preventDefault();
  $('join').hidden = true;
  $('call').hidden = false;
  state.track = $('fake').checked
    ? fakeTrack()
    : (await navigator.mediaDevices.getUserMedia({ audio: true })).getAudioTracks()[0];

  const pc = (state.pc = new RTCPeerConnection());
  pc.ontrack = (ev) => {
    const audio = new Audio();
    audio.autoplay = true;
    audio.srcObject = new MediaStream([ev.track]);
  };
  pc.onconnectionstatechange = () => {
    state.connected = pc.connectionState === 'connected';
    $('status').textContent = 'Соединение: ' + pc.connectionState;
  };

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const q = new URLSearchParams({ room: $('room').value, name: $('name').value });
  const ws = (state.ws = new WebSocket(`${proto}://${location.host}/ws?${q}`));
  ws.onclose = () => { $('status').textContent = 'Отключено'; };
  ws.onmessage = async (m) => {
    const msg = JSON.parse(m.data);
    switch (msg.type) {
      case 'welcome':
        state.myId = msg.id;
        msg.peers.forEach((p) => state.peers.set(p.id, p));
        renderPeers();
        break;
      case 'peer-joined': state.peers.set(msg.id, msg); renderPeers(); break;
      case 'peer-left': state.peers.delete(msg.id); renderPeers(); break;
      case 'speaking': setSpeaking(msg.id, msg.speaking); break;
      case 'offer': await onOffer(msg); break;
    }
  };

  setInterval(async () => {
    if (!state.pc) return;
    const s = await summary();
    for (const [id, v] of Object.entries(s.peers)) {
      const meta = document.querySelector('#peer-' + id + ' .meta');
      if (meta) meta.textContent = `${(v.bytes / 1024).toFixed(0)} КБ · потеряно ${v.lost}`;
    }
    const mine = document.querySelector('#peer-' + state.myId + ' .meta');
    if (mine) mine.textContent = `отправлено ${(s.sentBytes / 1024).toFixed(0)} КБ`;
  }, 1000);
};
</script>
</body>
</html>
