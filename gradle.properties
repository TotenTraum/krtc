org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true

# Maven coordinates of the published libraries. The group is a placeholder until a real one is chosen.
krtc.group=krtc
krtc.version=0.1.0-SNAPSHOT

# cinterop (OpenSSL) bindings shared by all native targets of krtc-sfu (needed for the nativeMain metadata publication)
kotlin.mpp.enableCInteropCommonization=true
